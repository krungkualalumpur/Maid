name: Continuous Integration
on:  
  push:
  pull_request:

jobs:
  format_checking:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rokit Setup
        uses: CompeyDev/setup-rokit@v0.1.2
      - name: run stylua
        run: |
          stylua src --check
  

